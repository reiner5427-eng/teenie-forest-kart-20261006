<!doctype html><html lang="ko"><meta charset="utf-8"><title>반응형 개발 검증</title><style>body{margin:0;background:#18352c;color:white;font:12px sans-serif}header{height:32px;padding:5px;box-sizing:border-box}button{font:inherit;margin-right:10px}#wrap{transform-origin:top left}iframe{border:0}#status{margin-left:12px}</style><header><button id="pc">PC 1280 × 720</button><button id="mobile">모바일 가로 844 × 390</button><button id="portrait">모바일 세로 390 × 844</button><span id="status"></span></header><div id="wrap"><iframe id="game" title="게임 검증" src="/?qa" width="1280" height="720"></iframe></div><script>const frame=document.querySelector('#game'),wrap=document.querySelector('#wrap'),status=document.querySelector('#status');function size(w,h){frame.width=w;frame.height=h;wrap.style.transform=`scale(${Math.min(innerWidth/w,(innerHeight-32)/h)})`;status.textContent=w+' × '+h;}document.querySelector('#pc').onclick=()=>size(1280,720);document.querySelector('#mobile').onclick=()=>size(844,390);document.querySelector('#portrait').onclick=()=>size(390,844);size(1280,720);addEventListener('resize',()=>size(Number(frame.width),Number(frame.height)));</script></html>
